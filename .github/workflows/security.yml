name: Security Scan

on:
  pull_request:
    branches:
      - main
      - test  

jobs:
  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run GitGuardian scan
        uses: GitGuardian/gg-shield-action@v1
        with:
          api_key: ${{ secrets.GITGUARDIAN_API_KEY }}
