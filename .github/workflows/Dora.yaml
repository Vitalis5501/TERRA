name: DORA Metrics Collection

on:
  workflow_dispatch:
  schedule:
    # Run every 5 minutes (GitHub minimum)
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
      - master
      - test

env:
  PROMETHEUS_PUSHGATEWAY_URL: ${{ secrets.PROMETHEUS_PUSHGATEWAY_URL }}
  GITHUB_TOKEN: ${{ secrets.TOKEN }}

jobs:
  collect-deployment-frequency:
    runs-on: ubuntu-latest
    # Only export metrics for test branch
    if: github.ref == 'refs/heads/test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Workflow Runs
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "THIRTY_DAYS_AGO=$THIRTY_DAYS_AGO"
          echo "Checking all workflow runs for test branch:"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/runs \
            --paginate \
            --jq "[.workflow_runs[] | select(.head_branch == \"test\" and .created_at > \"$THIRTY_DAYS_AGO\" and .conclusion == \"success\")] | {count: length, runs: [.[].name]}" > workflow_runs.json
          cat workflow_runs.json
          echo "Available workflow names:"
          jq '.runs | unique' workflow_runs.json

      - name: Calculate Deployment Frequency
        id: deployment_freq
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          DEPLOYMENTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/runs \
            --paginate \
            --jq "[.workflow_runs[] | select(.head_branch == \"test\" and .created_at > \"$THIRTY_DAYS_AGO\" and .conclusion == \"success\")] | length" || echo "0")
          echo "deployments_count=${DEPLOYMENTS}" >> $GITHUB_OUTPUT
          if [ "$DEPLOYMENTS" -gt 0 ]; then
            DAILY_FREQ=$(echo "scale=2; $DEPLOYMENTS / 30" | bc)
          else
            DAILY_FREQ=0
          fi
          echo "daily_frequency=${DAILY_FREQ}" >> $GITHUB_OUTPUT
          echo "Calculated deployments count (test branch): $DEPLOYMENTS"
          echo "Calculated daily frequency: $DAILY_FREQ"

      - name: Push Deployment Frequency to Prometheus
        run: |
          cat <<EOF | curl --data-binary @- ${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/dora_metrics/instance/deployment
          # TYPE deployment_frequency gauge
          # HELP deployment_frequency Number of deployments per day
          deployment_frequency{repository="${{ github.repository }}",environment="production"} ${{ steps.deployment_freq.outputs.daily_frequency }}
          # TYPE deployment_count_30d counter
          # HELP deployment_count_30d Total deployments in last 30 days
          deployment_count_30d{repository="${{ github.repository }}",environment="production"} ${{ steps.deployment_freq.outputs.deployments_count }}
          EOF

  collect-lead-time:
    runs-on: ubuntu-latest
    # Only export metrics for test branch
    if: github.ref == 'refs/heads/test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug All Pull Requests
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "THIRTY_DAYS_AGO=$THIRTY_DAYS_AGO"
          echo "Checking all merged PRs (no base filter):"
          gh pr list \
            --state merged \
            --limit 100 \
            --json number,createdAt,mergedAt,baseRefName \
            --jq "[.[] | select(.mergedAt > \"$THIRTY_DAYS_AGO\")] | {count: length, bases: [.[].baseRefName] | unique}" > all_prs.json
          cat all_prs.json
          echo "Available base branches for PRs:"
          jq '.bases' all_prs.json

      - name: Debug Pull Requests for test
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh pr list \
            --state merged \
            --base test \
            --limit 100 \
            --json number,createdAt,mergedAt \
            --jq "[.[] | select(.mergedAt > \"$THIRTY_DAYS_AGO\")]" > prs.json
          echo "Raw PRs data (base: test):"
          cat prs.json
          PR_COUNT=$(cat prs.json | jq 'length')
          echo "Merged PR count (test branch): $PR_COUNT"

      - name: Calculate Lead Time for Changes
        id: lead_time
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          LEAD_TIMES=$(gh pr list \
            --state merged \
            --base test \
            --limit 100 \
            --json number,createdAt,mergedAt \
            --jq "[.[] | select(.mergedAt > \"$THIRTY_DAYS_AGO\")] | map(((.mergedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) / 3600) | add / length" || echo "0")
          if [ -z "$LEAD_TIMES" ] || [ "$LEAD_TIMES" = "null" ]; then
            AVG_LEAD_TIME=0
          else
            AVG_LEAD_TIME=$LEAD_TIMES
          fi
          echo "average_lead_time_hours=${AVG_LEAD_TIME}" >> $GITHUB_OUTPUT
          echo "Calculated average lead time (hours): $AVG_LEAD_TIME"

      - name: Push Lead Time to Prometheus
        run: |
          cat <<EOF | curl --data-binary @- ${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/dora_metrics/instance/leadtime
          # TYPE lead_time_for_changes_hours gauge
          # HELP lead_time_for_changes_hours Average lead time from commit to deployment in hours
          lead_time_for_changes_hours{repository="${{ github.repository }}"} ${{ steps.lead_time.outputs.average_lead_time_hours }}
          EOF

  collect-mttr:
    runs-on: ubuntu-latest
    # Only export metrics for test branch
    if: github.ref == 'refs/heads/test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Incidents and Bugs
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "THIRTY_DAYS_AGO=$THIRTY_DAYS_AGO"
          echo "Checking all closed issues (no label filter):"
          gh issue list \
            --state closed \
            --limit 100 \
            --json number,createdAt,closedAt,labels \
            --jq "[.[] | select(.closedAt > \"$THIRTY_DAYS_AGO\")] | {count: length, labels: [.[].labels[].name] | unique}" > all_issues.json
          cat all_issues.json
          echo "Available issue labels:"
          jq '.labels' all_issues.json
          echo "Checking issues with 'incident' label:"
          gh issue list \
            --state closed \
            --label incident \
            --limit 100 \
            --json number,createdAt,closedAt \
            --jq "[.[] | select(.closedAt > \"$THIRTY_DAYS_AGO\")]" > incidents.json
          echo "Raw incidents data:"
          cat incidents.json
          INCIDENT_COUNT=$(cat incidents.json | jq 'length')
          echo "Incident count: $INCIDENT_COUNT"
          echo "Checking issues with 'bug' label:"
          gh issue list \
            --state closed \
            --label bug \
            --limit 100 \
            --json number,createdAt,closedAt \
            --jq "[.[] | select(.closedAt > \"$THIRTY_DAYS_AGO\")]" > bugs.json
          echo "Raw bugs data:"
          cat bugs.json
          BUG_COUNT=$(cat bugs.json | jq 'length')
          echo "Bug count: $BUG_COUNT"

      - name: Calculate Mean Time to Recovery
        id: mttr
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          MTTR_DATA=$(gh issue list \
            --state closed \
            --label incident \
            --limit 100 \
            --json number,createdAt,closedAt \
            --jq "[.[] | select(.closedAt > \"$THIRTY_DAYS_AGO\")] | map(((.closedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) / 3600)" || echo "[]")
          BUG_DATA=$(gh issue list \
            --state closed \
            --label bug \
            --limit 100 \
            --json number,createdAt,closedAt \
            --jq "[.[] | select(.closedAt > \"$THIRTY_DAYS_AGO\")] | map(((.closedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) / 3600)" || echo "[]")
          if [ "$MTTR_DATA" != "[]" ] && [ -n "$MTTR_DATA" ]; then
            AVG_MTTR=$(echo "$MTTR_DATA" | jq 'add / length // 0')
            INCIDENT_COUNT=$(echo "$MTTR_DATA" | jq 'length')
          else
            AVG_MTTR=0
            INCIDENT_COUNT=0
          fi
          echo "average_mttr_hours=${AVG_MTTR}" >> $GITHUB_OUTPUT
          echo "incident_count=${INCIDENT_COUNT}" >> $GITHUB_OUTPUT
          echo "Calculated average MTTR (hours): $AVG_MTTR"
          echo "Incident count: $INCIDENT_COUNT"

      - name: Push MTTR to Prometheus
        run: |
          cat <<EOF | curl --data-binary @- ${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/dora_metrics/instance/mttr
          # TYPE mean_time_to_recovery_hours gauge
          # HELP mean_time_to_recovery_hours Average time to recover from incidents in hours
          mean_time_to_recovery_hours{repository="${{ github.repository }}"} ${{ steps.mttr.outputs.average_mttr_hours }}
          # TYPE incident_count_30d counter
          # HELP incident_count_30d Number of incidents in last 30 days
          incident_count_30d{repository="${{ github.repository }}"} ${{ steps.mttr.outputs.incident_count }}
          EOF

  collect-change-failure-rate:
    runs-on: ubuntu-latest
    # Only export metrics for test branch
    if: github.ref == 'refs/heads/test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Workflow Runs for CFR
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "THIRTY_DAYS_AGO=$THIRTY_DAYS_AGO"
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/runs \
            --paginate \
            --jq "[.workflow_runs[] | select(.head_branch == \"test\" and .created_at > \"$THIRTY_DAYS_AGO\")] | {count: length, conclusions: [.[].conclusion] | unique}" > workflow_runs_cfr.json
          echo "Raw workflow runs data for CFR (test branch):"
          cat workflow_runs_cfr.json
          echo "Available workflow conclusions:"
          jq '.conclusions' workflow_runs_cfr.json

      - name: Calculate Change Failure Rate
        id: cfr
        run: |
          THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          TOTAL_DEPLOYMENTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/runs \
            --paginate \
            --jq "[.workflow_runs[] | select(.head_branch == \"test\" and .created_at > \"$THIRTY_DAYS_AGO\" and .conclusion == \"success\")] | length" || echo "0")
          FAILED_DEPLOYMENTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/runs \
            --paginate \
            --jq "[.workflow_runs[] | select(.head_branch == \"test\" and .created_at > \"$THIRTY_DAYS_AGO\" and .conclusion == \"failure\")] | length" || echo "0")
          if [ "$TOTAL_DEPLOYMENTS" -gt 0 ]; then
            CFR=$(echo "scale=4; $FAILED_DEPLOYMENTS / $TOTAL_DEPLOYMENTS * 100" | bc)
          else
            CFR=0
          fi
          echo "change_failure_rate=${CFR}" >> $GITHUB_OUTPUT
          echo "total_deployments=${TOTAL_DEPLOYMENTS}" >> $GITHUB_OUTPUT
          echo "failed_deployments=${FAILED_DEPLOYMENTS}" >> $GITHUB_OUTPUT
          echo "Calculated change failure rate (%): $CFR"
          echo "Total deployments: $TOTAL_DEPLOYMENTS"
          echo "Failed deployments: $FAILED_DEPLOYMENTS"

      - name: Push Change Failure Rate to Prometheus
        run: |
          cat <<EOF | curl --data-binary @- ${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/dora_metrics/instance/cfr
          # TYPE change_failure_rate gauge
          # HELP change_failure_rate Percentage of deployments causing failure in production
          change_failure_rate{repository="${{ github.repository }}"} ${{ steps.cfr.outputs.change_failure_rate }}
          # TYPE total_deployments_30d counter
          # HELP total_deployments_30d Total deployments in last 30 days
          total_deployments_30d{repository="${{ github.repository }}"} ${{ steps.cfr.outputs.total_deployments }}
          # TYPE failed_deployments_30d counter
          # HELP failed_deployments_30d Failed deployments in last 30 days
          failed_deployments_30d{repository="${{ github.repository }}"} ${{ steps.cfr.outputs.failed_deployments }}
          EOF

  push-collection-metadata:
    runs-on: ubuntu-latest
    needs: [collect-deployment-frequency, collect-lead-time, collect-mttr, collect-change-failure-rate]
    # Only export metrics for test branch
    if: github.ref == 'refs/heads/test'
    steps:
      - name: Push Collection Timestamp
        run: |
          TIMESTAMP=$(date +%s)
          echo "Collection timestamp: $TIMESTAMP"
          cat <<EOF | curl --data-binary @- ${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/dora_metrics/instance/metadata
          # TYPE dora_metrics_last_collection_timestamp gauge
          # HELP dora_metrics_last_collection_timestamp Timestamp of last DORA metrics collection
          dora_metrics_last_collection_timestamp{repository="${{ github.repository }}"} ${TIMESTAMP}
          # TYPE dora_metrics_collection_success gauge
          # HELP dora_metrics_collection_success Whether the last collection was successful (1) or not (0)
          dora_metrics_collection_success{repository="${{ github.repository }}"} 1
          EOF
