name: Debug DORA Metrics Collection

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  PROMETHEUS_PUSHGATEWAY_URL: ${{ secrets.PROMETHEUS_PUSHGATEWAY_URL }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  debug-and-push-test-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug GitHub API Access
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "GitHub Token present: ${{ env.GITHUB_TOKEN != '' }}"
          
          echo -e "\n=== Testing GitHub CLI ==="
          gh auth status
          
          echo -e "\n=== Repository Info ==="
          gh api /repos/${{ github.repository }} --jq '.full_name, .private, .default_branch'
          
          echo -e "\n=== Checking Deployments ==="
          DEPLOYMENTS=$(gh api /repos/${{ github.repository }}/deployments --paginate --jq '. | length' || echo "0")
          echo "Total deployments found: ${DEPLOYMENTS:-0}"
          
          echo -e "\n=== Checking Pull Requests ==="
          PR_COUNT=$(gh pr list --state all --limit 10 --json number --jq '. | length' || echo "0")
          echo "Total PRs found: ${PR_COUNT:-0}"
          
          echo -e "\n=== Checking Issues ==="
          ISSUE_COUNT=$(gh issue list --state all --limit 10 --json number --jq '. | length' || echo "0")
          echo "Total issues found: ${ISSUE_COUNT:-0}"
          
          echo -e "\n=== Checking Commits ==="
          COMMIT_COUNT=$(git rev-list --count --since="30 days ago" HEAD || echo "0")
          echo "Commits in last 30 days: ${COMMIT_COUNT:-0}"

      - name: Generate and Push Test Metrics
        run: |
          REPOSITORY="${{ github.repository }}"
          TIMESTAMP=$(date +%s)
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ID="${{ github.run_id }}"
          
          # Generate realistic test values
          DEPLOYMENT_FREQ=$(echo "scale=2; $RANDOM / 10000" | bc)
          LEAD_TIME=$(echo "scale=2; $RANDOM / 1000" | bc)
          MTTR=$(echo "scale=2; $RANDOM / 5000" | bc)
          CFR=$(echo "scale=2; $RANDOM / 3276" | bc)
          
          echo "=== Pushing Test DORA Metrics ==="
          echo "Repository: $REPOSITORY"
          echo "Pushgateway URL: $PROMETHEUS_PUSHGATEWAY_URL"
          echo "Deployment Frequency: $DEPLOYMENT_FREQ"
          echo "Lead Time: $LEAD_TIME hours"
          echo "MTTR: $MTTR hours"
          echo "Change Failure Rate: $CFR %"
          
          # Create comprehensive metrics
          cat <<EOF > /tmp/metrics.txt
# HELP deployment_frequency Number of deployments per day
# TYPE deployment_frequency gauge
deployment_frequency{repository="${REPOSITORY}",environment="production",run_id="${RUN_ID}"} ${DEPLOYMENT_FREQ}

# HELP deployment_count_30d Total deployments in last 30 days
# TYPE deployment_count_30d gauge
deployment_count_30d{repository="${REPOSITORY}",environment="production"} ${RUN_NUMBER}

# HELP lead_time_for_changes_hours Average lead time from commit to deployment in hours
# TYPE lead_time_for_changes_hours gauge
lead_time_for_changes_hours{repository="${REPOSITORY}"} ${LEAD_TIME}

# HELP mean_time_to_recovery_hours Average time to recover from incidents in hours
# TYPE mean_time_to_recovery_hours gauge
mean_time_to_recovery_hours{repository="${REPOSITORY}"} ${MTTR}

# HELP incident_count_30d Number of incidents in last 30 days
# TYPE incident_count_30d gauge
incident_count_30d{repository="${REPOSITORY}"} 3

# HELP change_failure_rate Percentage of deployments causing failure in production
# TYPE change_failure_rate gauge
change_failure_rate{repository="${REPOSITORY}"} ${CFR}

# HELP total_deployments_30d Total deployments in last 30 days  
# TYPE total_deployments_30d gauge
total_deployments_30d{repository="${REPOSITORY}"} ${RUN_NUMBER}

# HELP failed_deployments_30d Failed deployments in last 30 days
# TYPE failed_deployments_30d gauge
failed_deployments_30d{repository="${REPOSITORY}"} 1

# HELP dora_metrics_last_collection_timestamp Timestamp of last DORA metrics collection
# TYPE dora_metrics_last_collection_timestamp gauge
dora_metrics_last_collection_timestamp{repository="${REPOSITORY}"} ${TIMESTAMP}

# HELP dora_metrics_collection_success Whether the last collection was successful
# TYPE dora_metrics_collection_success gauge
dora_metrics_collection_success{repository="${REPOSITORY}"} 1

# HELP github_action_run_number GitHub Action run number
# TYPE github_action_run_number gauge
github_action_run_number{repository="${REPOSITORY}",workflow="${{ github.workflow }}"} ${RUN_NUMBER}
EOF

          echo -e "\n=== Metrics to be pushed ==="
          cat /tmp/metrics.txt
          
          echo -e "\n=== Pushing to Pushgateway ==="
          
          # Push metrics with curl verbose mode
          curl -v --data-binary @/tmp/metrics.txt \
               "${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/dora_metrics/instance/$(echo ${REPOSITORY} | sed 's/\//_/g')"
          
          CURL_EXIT_CODE=$?
          echo "Curl exit code: $CURL_EXIT_CODE"
          
          if [ $CURL_EXIT_CODE -eq 0 ]; then
            echo "✅ Successfully pushed metrics to Pushgateway"
          else
            echo "❌ Failed to push metrics (exit code: $CURL_EXIT_CODE)"
            exit 1
          fi
          
          echo -e "\n=== Verifying metrics were received ==="
          sleep 2
          
          # Try to fetch metrics back
          echo "Attempting to retrieve metrics from Pushgateway..."
          curl -s "${PROMETHEUS_PUSHGATEWAY_URL}/metrics" | grep -E "deployment_frequency.*${REPOSITORY}" || echo "Could not verify metrics"

      - name: Alternative Push Method - Direct POST
        if: always()
        run: |
          echo -e "\n=== Trying alternative push method ==="
          
          REPOSITORY="${{ github.repository }}"
          SAFE_REPO=$(echo ${REPOSITORY} | sed 's/\//_/g')
          
          # Simple metric for testing
          echo "github_workflow_test_metric{repository=\"${REPOSITORY}\",method=\"direct_post\"} ${{ github.run_number }}" | \
          curl -X POST -H "Content-Type: text/plain" --data-binary @- \
               "${PROMETHEUS_PUSHGATEWAY_URL}/metrics/job/test_job/instance/${SAFE_REPO}"
          
          echo -e "\n✅ Alternative method completed"

      - name: Check Network Connectivity
        if: always()
        run: |
          echo -e "\n=== Network Diagnostics ==="
          
          # Extract hostname from URL
          PUSHGATEWAY_HOST=$(echo $PROMETHEUS_PUSHGATEWAY_URL | sed -E 's|https?://([^:/]+).*|\1|')
          echo "Pushgateway Host: $PUSHGATEWAY_HOST"
          
          # Check DNS resolution
          echo -e "\n=== DNS Resolution ==="
          nslookup $PUSHGATEWAY_HOST || echo "DNS lookup failed"
          
          # Try a simple GET request
          echo -e "\n=== Testing GET request to Pushgateway ==="
          curl -I "${PROMETHEUS_PUSHGATEWAY_URL}" || echo "GET request failed"
          
          # Check with wget as alternative
          echo -e "\n=== Testing with wget ==="
          wget --spider "${PROMETHEUS_PUSHGATEWAY_URL}" 2>&1 || echo "wget test failed"
