version: 3
automerge: true
projects:
  - name: myproject
    dir: .
    workflow: default
    env:
      TF_CLI_ARGS: "-no-color"  # ✅ Correct place
workflows:
  default:
    plan:
      steps:
        - run: terraform init -upgrade
        - run: terraform plan -out=tfplan
    apply:
      steps:
        - run: terraform apply tfplan
