version: 3
automerge: true

projects:
  - name: myproject
    dir: .
    workflow: default
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - "*.yaml"
        - "*.yml"

workflows:
  default:
    plan:
      steps:
        - run: terraform init -upgrade -no-color
        - run: terraform plan -out=tfplan -no-color
    apply:
      steps:
        - run: terraform apply tfplan -no-color
